<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">KV cache vs linear-attention state</title>
  <desc id="desc">A full-attention layer stores one key and value entry per token, so its cache holds 4 entries after 4 tokens and 8 after 8. A linear-attention layer stores one fixed-size state matrix that every token updates in place, so it is the same size after 4 tokens and after 8.</desc>

  <rect x="0" y="0" width="760" height="330" rx="10" fill="#ffffff" stroke="#d1d5db"/>

  <!-- column headers -->
  <text x="224" y="34" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">after 4 tokens</text>
  <text x="558" y="34" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">after 8 tokens</text>

  <!-- row 1: full attention -->
  <text x="20" y="92" font-size="15" font-weight="bold" fill="#111827">Full attention</text>
  <text x="20" y="111" font-size="13" fill="#4b5563">KV cache</text>

  <g stroke="#ffffff" stroke-width="1">
    <!-- after 4 tokens: x = 160 + 32·i -->
    <rect x="160" y="66" width="28" height="22" fill="#f4a261"/><rect x="160" y="88" width="28" height="22" fill="#8ecae6"/>
    <rect x="192" y="66" width="28" height="22" fill="#f4a261"/><rect x="192" y="88" width="28" height="22" fill="#8ecae6"/>
    <rect x="224" y="66" width="28" height="22" fill="#f4a261"/><rect x="224" y="88" width="28" height="22" fill="#8ecae6"/>
    <rect x="256" y="66" width="28" height="22" fill="#f4a261"/><rect x="256" y="88" width="28" height="22" fill="#8ecae6"/>
    <!-- after 8 tokens: x = 430 + 32·i -->
    <rect x="430" y="66" width="28" height="22" fill="#f4a261"/><rect x="430" y="88" width="28" height="22" fill="#8ecae6"/>
    <rect x="462" y="66" width="28" height="22" fill="#f4a261"/><rect x="462" y="88" width="28" height="22" fill="#8ecae6"/>
    <rect x="494" y="66" width="28" height="22" fill="#f4a261"/><rect x="494" y="88" width="28" height="22" fill="#8ecae6"/>
    <rect x="526" y="66" width="28" height="22" fill="#f4a261"/><rect x="526" y="88" width="28" height="22" fill="#8ecae6"/>
    <rect x="558" y="66" width="28" height="22" fill="#f4a261"/><rect x="558" y="88" width="28" height="22" fill="#8ecae6"/>
    <rect x="590" y="66" width="28" height="22" fill="#f4a261"/><rect x="590" y="88" width="28" height="22" fill="#8ecae6"/>
    <rect x="622" y="66" width="28" height="22" fill="#f4a261"/><rect x="622" y="88" width="28" height="22" fill="#8ecae6"/>
    <rect x="654" y="66" width="28" height="22" fill="#f4a261"/><rect x="654" y="88" width="28" height="22" fill="#8ecae6"/>
  </g>
  <g font-size="11" fill="#1f2937" text-anchor="middle">
    <text x="174" y="81">K</text><text x="174" y="103">V</text>
    <text x="444" y="81">K</text><text x="444" y="103">V</text>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="174" y="126">1</text><text x="206" y="126">2</text><text x="238" y="126">3</text><text x="270" y="126">4</text>
    <text x="444" y="126">1</text><text x="476" y="126">2</text><text x="508" y="126">3</text><text x="540" y="126">4</text>
    <text x="572" y="126">5</text><text x="604" y="126">6</text><text x="636" y="126">7</text><text x="668" y="126">8</text>
  </g>
  <text x="420" y="152" font-size="13" fill="#b45309" text-anchor="middle">one K, V entry per token: grows with the context</text>

  <line x1="20" y1="172" x2="740" y2="172" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- row 2: linear attention -->
  <text x="20" y="226" font-size="15" font-weight="bold" fill="#111827">Linear attention</text>
  <text x="20" y="245" font-size="13" fill="#4b5563">state</text>

  <rect x="192" y="193" width="64" height="64" rx="4" fill="#b7e4c7" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="222" y="230" font-size="17" fill="#1b4332" text-anchor="middle">S</text><text x="229" y="235" font-size="11" fill="#1b4332">4</text>
  <rect x="526" y="193" width="64" height="64" rx="4" fill="#b7e4c7" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="556" y="230" font-size="17" fill="#1b4332" text-anchor="middle">S</text><text x="563" y="235" font-size="11" fill="#1b4332">8</text>

  <!-- update loop on the right-hand state -->
  <path d="M 590 210 C 640 200, 640 250, 592 242" fill="none" stroke="#2d6a4f" stroke-width="1.5"/>
  <path d="M 598 238 L 590 243 L 599 247" fill="none" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="648" y="222" font-size="12" fill="#2d6a4f">each token</text>
  <text x="648" y="238" font-size="12" fill="#2d6a4f">updates it</text>
  <text x="648" y="254" font-size="12" fill="#2d6a4f">in place</text>

  <text x="420" y="292" font-size="13" fill="#2d6a4f" text-anchor="middle">one fixed-size matrix per head: the same size at every step</text>
</svg>
